<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>رفّ عبدالعزيز</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: faded backdrop, profile, then a "file drawer" menu (media folder tabs over a deck of view tiles), content + sidebar on wide screens */
:root{
  --bg:#14181d; --panel:#1b2128; --raise:#232b34; --line:#2b333d;
  --fg:#e4e9ef; --mute:#8b98a7; --dim:#5d6a79;
  --games:#8a7bff; --movies:#ff8a3d; --shows:#22c7a9;
  --accent:var(--games); --star:#f6c445;
  --f-body:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;
  --f-disp:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app[data-kind="movies"]{--accent:var(--movies)}
.app[data-kind="shows"]{--accent:var(--shows)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1020px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(20,24,29,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.06)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;height:56px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-weight:800;font-size:21px}
.dots{display:flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;opacity:.45;transition:opacity .2s}
.dots i:nth-child(1){background:var(--games)}.dots i:nth-child(2){background:var(--movies)}.dots i:nth-child(3){background:var(--shows)}
.app[data-kind="games"] .dots i:nth-child(1),.app[data-kind="movies"] .dots i:nth-child(2),.app[data-kind="shows"] .dots i:nth-child(3){opacity:1}
.save{font-size:11px;font-family:var(--f-body);font-weight:500;color:var(--mute);white-space:nowrap}
.tsearch{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;height:38px;padding:0 12px;width:min(320px,58vw);transition:border-color .15s}
.tsearch:focus-within{border-color:var(--accent)}
.tsearch svg{width:17px;height:17px;flex:none;fill:none;stroke:var(--mute);stroke-width:2.2;stroke-linecap:round}
.tsearch input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14px;color:var(--fg);padding:0}
.tsearch input::placeholder{color:var(--dim)}
.tsearch input::-webkit-search-cancel-button{display:none}

/* backdrop */
.backdrop{position:relative;height:clamp(150px,34vw,360px);margin-top:-56px;overflow:hidden;background:radial-gradient(120% 90% at 70% 10%,color-mix(in srgb,var(--accent) 45%,transparent),transparent 60%),linear-gradient(160deg,#25303c,var(--bg))}
.backdrop img{width:100%;height:100%;object-fit:cover;display:block}
.backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(20,24,29,.35) 0,transparent 30%,transparent 50%,var(--bg) 100%),linear-gradient(to right,var(--bg),transparent 18%,transparent 82%,var(--bg))}
.bd-btn{position:absolute;bottom:14px;inset-inline-start:max(16px,env(safe-area-inset-left,0px));z-index:2;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:20px;padding:5px 12px;font-size:12px}

/* profile head */
.head{display:flex;flex-wrap:wrap;align-items:center;gap:16px 22px;margin-top:-34px;position:relative;z-index:2}
.avatar{width:92px;height:92px;border-radius:50%;background:var(--accent);color:#111;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:38px;box-shadow:0 0 0 4px var(--bg);flex:none}
.idt{flex:1;min-width:170px;display:grid;gap:6px}
.idt-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.idt h1{margin:0;font-family:var(--f-disp);font-weight:800;font-size:clamp(22px,3.6vw,30px);line-height:1.15}
.idt p{margin:0;color:var(--mute)}
.edit{background:var(--raise);border:0;border-radius:4px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--mute)}
.edit:hover{color:var(--fg)}
.stats{display:flex}
.stat{padding:0 16px;text-align:center;border-inline-start:1px solid var(--line)}
.stat:first-child{border:0}
.stat b{display:block;font-family:var(--f-disp);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:11px;color:var(--mute);letter-spacing:.3px}
@media (max-width:760px){.stats{width:100%;justify-content:space-between}.stat{flex:1;padding:0 4px}}

/* the drawer menu: folder tabs + tile deck */
.drawer{margin-top:24px}
.folders{display:flex;gap:4px;padding-inline-start:14px;position:relative;z-index:1}
.folders button{--c:var(--games);position:relative;background:var(--raise);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:9px 16px 10px;color:var(--mute);font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px;white-space:nowrap;margin-bottom:-1px;transition:color .15s,padding .15s}
.folders [data-k="movies"]{--c:var(--movies)} .folders [data-k="shows"]{--c:var(--shows)}
.folders button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.folders button[aria-pressed="true"]{background:var(--panel);color:var(--fg);padding-top:12px;box-shadow:inset 0 3px 0 var(--c)}
.deck{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tile{background:var(--bg);border:1px solid transparent;border-radius:10px;padding:12px 10px 10px;display:grid;gap:6px;justify-items:start;text-align:start;color:var(--mute);transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--line);color:var(--fg)}
.tile svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile-top{display:flex;justify-content:space-between;align-items:center;width:100%}
.tile b{font-family:var(--f-disp);font-size:15px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile[aria-current="true"]{background:color-mix(in srgb,var(--accent) 16%,var(--bg));border-color:var(--accent);color:var(--fg)}
.tile[aria-current="true"] svg{stroke:var(--accent)}
@media (max-width:760px){
  .deck{grid-template-columns:repeat(3,1fr)}
  .folders{padding-inline-start:8px}
  .folders button{padding:8px 11px 9px;font-size:13px}
  .folders button[aria-pressed="true"]{padding-top:11px}
}
@media (max-width:380px){.folders button{padding-inline:8px;font-size:12px}}

/* floating log button */
.fab{position:fixed;z-index:9;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-end:max(18px,env(safe-area-inset-left,0px));background:var(--accent);color:#111;border:0;border-radius:16px;padding:14px 20px;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;align-items:center;gap:6px}

/* layout */
.layout{display:grid;grid-template-columns:1fr 250px;gap:40px;padding-block:28px 100px}
@media (max-width:760px){.layout{grid-template-columns:1fr;gap:32px}}
main,aside{min-width:0;display:grid;gap:34px;align-content:start}
.full{grid-column:1/-1}

.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:14px}
.sh h2{margin:0;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.6px}
.sh button{background:none;border:0;padding:0;font-size:12px;color:var(--dim)}
.sh button:hover{color:var(--accent)}

/* posters */
.posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.posters.fav{grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:520px){.posters.fav{gap:6px}.posters.fav .cover{font-size:10px;padding:5px}}
.card{background:none;border:0;padding:0;text-align:start;display:grid;gap:5px;align-content:start;min-width:0}
.cover{aspect-ratio:2/3;max-width:100%;border-radius:4px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:8px;font-family:var(--f-disp);font-weight:700;font-size:12px;line-height:1.3;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent 55%)}
.cover span{position:relative;overflow-wrap:anywhere}
.cover>span:last-child{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:10px;background:rgba(10,12,16,.68);opacity:0;transition:opacity .15s;z-index:1}
.card:hover .cover>span:last-child,.card:focus-visible .cover>span:last-child,.slot:hover .cover>span:last-child{opacity:1}
.cover::before{background:none!important}
.card:hover .cover{box-shadow:inset 0 0 0 2px var(--accent)}
.tag{position:absolute;top:5px;inset-inline-start:5px;background:rgba(0,0,0,.6);font-family:var(--f-body);font-style:normal;font-weight:600;font-size:10px;padding:1px 6px;border-radius:3px}
.crown{position:absolute;top:3px;inset-inline-end:5px;font-size:15px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.cover.crowned{box-shadow:inset 0 0 0 2px var(--star)}
.cover .pins{position:absolute;top:5px;inset-inline-start:5px;display:flex;gap:4px;align-items:center}
.pins .tag{position:static}
.sb{width:20px;height:20px;border-radius:50%;background:var(--sc);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.5);flex:none}
.sb svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mute);margin:-6px 0 14px}
.legend span{display:flex;align-items:center;gap:6px}
.lsearch{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;height:36px;padding:0 10px;margin-bottom:14px;max-width:360px}
.lsearch:focus-within{border-color:var(--accent)}
.lsearch svg{width:16px;height:16px;flex:none;fill:none;stroke:var(--mute);stroke-width:2.2;stroke-linecap:round}
.lsearch input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14px;color:var(--fg)}
/* favorites editor */
.fe-kinds{display:flex;gap:6px}
.fe-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:start}
.slot-empty{width:100%;padding:0;aspect-ratio:2/3}
.slot .cover{aspect-ratio:2/3;height:auto}
.cover,.slot-empty,.slot{box-sizing:border-box}
.slot{display:grid;gap:4px;min-width:0}
.slot .cover{width:100%;font-size:10px;padding:6px;cursor:grab}
.slot,.slot-empty{width:100%;align-self:start}
.slot.drag{opacity:.4}
.slot.over .cover{box-shadow:inset 0 0 0 2px var(--accent)}
.slot-empty{aspect-ratio:2/3;border:1.5px dashed var(--line);border-radius:4px;background:none;color:var(--dim);font-size:22px;display:grid;place-items:center}
.slot-empty:hover{border-color:var(--accent);color:var(--accent)}
.sctl{display:flex;justify-content:space-between;gap:2px}
.sctl button{flex:1;min-width:0;white-space:nowrap;background:var(--raise);border:0;border-radius:4px;height:24px;font-size:11px;color:var(--mute);padding:0}
.sctl button:hover{color:var(--fg)}
.sctl button:disabled{opacity:.25}
.sctl button[aria-pressed="true"]{background:color-mix(in srgb,var(--star) 30%,var(--raise))}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;max-height:55vh;overflow:auto;padding:2px}
.pick-grid .card .cover{font-size:10px;padding:5px}
.pick-grid .card[disabled]{opacity:.35;cursor:default}
.rank{position:absolute;top:4px;inset-inline-end:5px;background:var(--accent);color:#111;font-family:var(--f-disp);font-weight:800;font-size:11px;border-radius:4px;padding:0 6px}
.meta{display:flex;justify-content:space-between;gap:4px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.stars{color:var(--star);letter-spacing:.5px}
.empty{color:var(--mute);font-size:13px;padding:20px;border:1px dashed var(--line);border-radius:6px;text-align:center}

.hist{display:flex;align-items:flex-end;gap:2px;height:64px}
.hist i{flex:1;background:var(--dim);border-radius:2px 2px 0 0}
.hist i:hover{background:var(--accent)}
.hist-l{display:flex;justify-content:space-between;font-size:11px;color:var(--star);margin-top:4px}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar h2{margin:0;font-family:var(--f-disp);font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 11px;font-size:13px;color:var(--mute)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--fg)}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px 14px;font-size:14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#111}
.btn.sm{padding:5px 10px;font-size:13px}

.revs{display:grid}
.rev{display:grid;grid-template-columns:62px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;text-align:start;width:100%}
.rev:last-child{border-bottom:0}
.rev .cover{padding:0;font-size:0}
.rev .cover::before{background:none}
.rev h4{margin:0;font-family:var(--f-disp);font-size:16px}
.rev .rm{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--dim);margin-top:3px}
.rev p{margin:8px 0 0;line-height:1.75;color:#c7cfd8;max-width:65ch}

/* lists */
.ideas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;align-items:center}
.ideas small{color:var(--dim);font-size:12px}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:start;display:grid;gap:12px;align-content:start}
.lcard:hover{border-color:var(--accent)}
.fan{display:flex;height:84px}
.fan .cover{width:56px;padding:0;flex:none;box-shadow:0 0 0 2px var(--panel),inset 0 0 0 1px rgba(255,255,255,.12)}
.fan .cover+.cover{margin-inline-start:-18px}
.fan .cover::before{background:none}
.lcard h3{margin:0;font-family:var(--f-disp);font-size:16px}
.lcard p{margin:0;font-size:12.5px;color:var(--mute)}
.ranked{display:grid;gap:8px;counter-reset:r}
.ritem{display:grid;grid-template-columns:34px 46px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ritem .n{font-family:var(--f-disp);font-weight:800;font-size:20px;color:var(--accent);text-align:center}
.ritem .cover{padding:0}
.ritem .cover::before{background:none}
.ritem h4{margin:0;font-size:15px;overflow-wrap:anywhere}
.ritem small{color:var(--dim);font-size:12px}
.ctl{display:flex;gap:4px}
.ctl button{background:var(--raise);border:0;border-radius:6px;width:30px;height:30px;color:var(--mute);font-size:14px}
.ctl button:hover{color:var(--fg)}
.ctl button:disabled{opacity:.3;cursor:default}
.adder{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.adder select{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.ldesc{color:var(--mute);margin:-4px 0 14px;max-width:65ch;line-height:1.7}

/* friends */
.friends{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;text-align:start}
.fcard:hover{border-color:var(--accent)}
.fav-av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:20px;color:#111}
.fcard b{display:block;font-size:15px}
.fcard small{display:block;color:var(--mute);font-size:12.5px;overflow-wrap:anywhere}
.fcard a{color:var(--accent);font-size:12.5px;text-decoration:none}

.fab svg{width:18px;height:18px;fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:round}
/* search */
.sbar{display:flex;gap:8px}
.sbar input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;color:var(--fg)}
.sres{display:grid;gap:6px;max-height:52vh;overflow:auto}
.srow{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;background:var(--bg);border:1px solid transparent;border-radius:8px;padding:7px 9px;text-align:start;width:100%}
.srow:hover{border-color:var(--accent)}
.srow .cover{padding:0}.srow .cover::before{background:none}
.srow b{display:block;font-size:14.5px;overflow-wrap:anywhere}
.srow small{color:var(--mute);font-size:12px}
.have{font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap}
.sstate{color:var(--mute);font-size:14px;text-align:center;padding:18px 6px}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--dim);font-size:13px;text-decoration:underline;justify-self:start}
.linkbtn:hover{color:var(--fg)}
.detail{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:start}
@media (max-width:420px){.detail{grid-template-columns:90px 1fr}}
.detail .cover{font-size:13px}
.detail h3{font-size:20px;margin:0 0 4px}
.dmeta{display:grid;gap:3px;font-size:13px;color:var(--mute)}
.dmeta b{color:var(--fg);font-weight:600}
.dabout{margin:10px 0 0;line-height:1.7;font-size:14px}
.dact{display:flex;gap:8px;flex-wrap:wrap}
.fixed-title{font-family:var(--f-disp);font-size:17px;font-weight:700;padding:4px 0}

/* modals */
.overlay{position:fixed;inset:0;background:rgba(5,7,10,.72);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(470px,100%);max-height:88vh;overflow:auto;padding:20px;display:grid;gap:12px}
.modal h3{margin:0;font-family:var(--f-disp);font-size:19px}
.f{display:grid;gap:4px;font-size:12px;color:var(--mute)}
.f input,.f select,.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-size:15px;color:var(--fg)}
.f textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.m-actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.danger{color:#ff6b6b}
.bn-row{display:flex;gap:8px;flex-wrap:wrap}
.bn-prev{height:72px;border-radius:6px;background:var(--bg) center/cover no-repeat;border:1px solid var(--line)}
.hint{font-size:12px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>

<div class="app" id="app" dir="rtl" lang="ar" data-kind="games">
  <header class="topbar">

<script>
const TEMPLATE = document.getElementById('app').parentNode.innerHTML;
const STATE_RE = /(<script id="state" type="application\/json">)[\s\S]*?(<\/script>)/;
let S = JSON.parse(document.getElementById('state').textContent);
S.profile.banner = S.profile.banner || '';
S.lists = S.lists || []; S.friends = S.friends || [];
if (!S.favs) { S.favs = {games:[],movies:[],shows:[]}; S.items.forEach(i => { if (i.fav && S.favs[i.kind] && S.favs[i.kind].length < 5) S.favs[i.kind].push(i.id); }); }
S.crown = S.crown || {}; S.items.forEach(i => delete i.fav);
const isFav = i => (S.favs[i.kind]||[]).includes(i.id);
const isCrown = i => S.crown[i.kind] === i.id;

const KINDS = {
  games:{name:'الألعاب',done:'خلصتها',played:'لعبتها',dropped:'تركتها',playing:'ألعبها الحين',paused:'موقّفها',wish:'ناوي ألعبها',list:'قائمة الأمنيات',short:'الأمنيات',back:'موقّفها، ترجع لها',total:'لعبتها',unit:'لعبة',best:'ألعاب'},
  movies:{name:'الأفلام',done:'شفته',played:'شفت منه',dropped:'تركته',playing:'أشوفه الحين',paused:'وقفته',wish:'أبي أشوفه',list:'قائمة المشاهدة',short:'للمشاهدة',back:'وقفتها، ترجع لها',total:'شفتها',unit:'فيلم',best:'أفلام'},
  shows:{name:'المسلسلات والأنمي',done:'خلصته',played:'تابعت منه',dropped:'تركته',playing:'أتابعه الحين',paused:'وقفته',wish:'أبي أتابعه',list:'قائمة المشاهدة',short:'للمشاهدة',back:'وقفتها، ترجع لها',total:'خلصتها',unit:'عمل',best:'مسلسلات وأنمي'}
};
const STATUSES = ['done','played','playing','paused','dropped','wish'];
const SICON = {
  done:{c:'#2fbf5b', svg:'<path d="M7 9h10a4 4 0 0 1 4 4v1.5a2.5 2.5 0 0 1-4.6 1.4L15 14H9l-1.4 1.9A2.5 2.5 0 0 1 3 14.5V13a4 4 0 0 1 4-4z"/><path d="M7.5 11.2v2.6M6.2 12.5h2.6"/><circle cx="15.5" cy="12" r=".6"/><circle cx="17" cy="13.4" r=".6"/>'},
  played:{c:'#e5484d', svg:'<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M11 10.5V4.5a1.5 1.5 0 0 1 3 0v6"/><path d="M14 10.5V6a1.5 1.5 0 0 1 3 0v6"/><path d="M17 11a1.5 1.5 0 0 1 3 0v3a7 7 0 0 1-7 7h-1.2a6 6 0 0 1-4.6-2.2L4 15.6a1.6 1.6 0 0 1 2.4-2.1L8 15"/>'},
  dropped:{c:'#8a94a3', svg:'<path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/><path d="M12 7.5l3.2 1.3 1.3 3.2-1.3 3.2-3.2 1.3-3.2-1.3L7.5 12l1.3-3.2z"/><path d="M12 4.8l5.1 2.1 2.1 5.1-2.1 5.1-5.1 2.1-5.1-2.1L4.8 12l2.1-5.1z"/>'}
};
const badge = s => SICON[s] ? `<i class="sb" style="--sc:${SICON[s].c}" title="${s}"><svg viewBox="0 0 24 24">${SICON[s].svg}</svg></i>` : '';
const YEAR = String(new Date().getFullYear());
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,5);

let kind = 'games', view = 'profile', libFilter = 'done', listId = null, libQ = '';
let editing = null, editingList = null, editingFriend = null, pendingBanner = null;
try { kind = localStorage.getItem('shelf-kind') || 'games'; } catch(e) {}
if (!KINDS[kind]) kind = 'games';

const ICONS = {
  profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  library:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="9" rx="1"/><rect x="3" y="15" width="7" height="6" rx="1"/><rect x="14" y="15" width="7" height="6" rx="1"/>',
  wish:'<path d="M6 3h12v18l-6-4-6 4z"/>',
  reviews:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
  lists:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 5l1 1 2-2M4 11l1 1 2-2M4 17l1 1 2-2"/>',
  friends:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4 1.3 4.8 4"/>'
};

function hue(t){ let h=0; for (const c of t) h=(h*31+c.charCodeAt(0))%360; return h; }
function stars(r){ if(!r) return ''; return '★'.repeat(Math.floor(r)) + (r%1 ? '½' : ''); }
function fmtDate(d){ if(!d) return ''; const [y,m,dd]=d.split('-'); const mo=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'][+m-1]; return (+dd)+' '+mo+(y!==YEAR?' '+y:''); }
const mine = () => S.items.filter(i => i.kind === kind);
const byDate = arr => [...arr].sort((a,b) => (b.date||'').localeCompare(a.date||''));
const itemById = id => S.items.find(i => i.id === id);

function cover(i, rank){
  const h = hue(i.title);
  return `<div class="cover${i.id && isCrown(i) ? ' crowned' : ''}" style="background:linear-gradient(160deg,hsl(${h} 55% 46%),hsl(${(h+40)%360} 55% 20%))">
      <span class="pins">${badge(i.status)}${i.ex ? '<em class="tag">مثال</em>' : (i.sub ? `<em class="tag">${esc(i.sub)}</em>` : '')}</span>
      ${rank ? `<em class="rank">${rank}</em>` : (i.id && isCrown(i) ? '<span class="crown" aria-label="تاج">👑</span>' : '')}
      <span>${esc(i.title)}</span></div>`;
}
function card(i, rank){
  const left = ['done','played','dropped'].includes(i.status) && i.date ? fmtDate(i.date) : KINDS[i.kind][i.status];
  return `<button class="card" data-id="${esc(i.id)}" type="button">${cover(i, rank)}
    <div class="meta"><span>${esc(left)}</span><span class="stars">${stars(i.rating)}</span></div></button>`;
}
const grid = (list, empty, cls='', ranked) => list.length ? `<div class="posters ${cls}">${list.map((i,ix)=>card(i, ranked?ix+1:0)).join('')}</div>` : `<div class="empty">${empty}</div>`;
const sh = (title, link) => `<div class="sh"><h2>${title}</h2>${link||''}</div>`;
function reviewList(list){
  return `<div class="revs">${list.map(i => `<button class="rev card" data-id="${esc(i.id)}" type="button">${cover(i)}<div><h4>${esc(i.title)}</h4>
    <div class="rm"><span class="stars">${stars(i.rating)}</span><span>${fmtDate(i.date)}</span></div>
    <p>${esc(i.review)}</p></div></button>`).join('')}</div>`;
}

/* ---- views ---- */
function sidebar(){
  const K = KINDS[kind], all = mine();
  const rated = all.filter(i=>i.rating>0), counts = Array(10).fill(0);
  rated.forEach(i => counts[Math.round(i.rating*2)-1]++);
  const max = Math.max(1,...counts);
  const playing = byDate(all.filter(i=>i.status==='playing'));
  return `<aside>
    ${playing.length ? `<section>${sh(K.playing)}${grid(playing,'')}</section>` : ''}
    <section>${sh(`التقييمات · ${rated.length}`)}
      <div class="hist">${counts.map((c,ix)=>`<i style="height:${Math.max(4,c/max*100)}%" title="${(ix+1)/2}★: ${c}"></i>`).join('')}</div>
      <div class="hist-l"><span>½</span><span>★★★★★</span></div>
    </section>
  </aside>`;
}
function renderProfile(){
  const K = KINDS[kind], all = mine();
  const favs = (S.favs[kind]||[]).map(itemById).filter(Boolean);
  const recent = byDate(all.filter(i => i.status==='done' && (i.date||'').startsWith(YEAR)));
  const paused = byDate(all.filter(i => i.status==='paused'));
  const revs = byDate(all.filter(i => i.review)).slice(0,3);
  
  return `<main>
    <section>${sh('المفضلة', '<button type="button" data-editfav>تعديل ‹</button>')}${grid(favs, 'اختار مفضلاتك من «تعديل الملف»', 'fav')}</section>
    <section>${sh('آخر نشاط')}${grid(recent.slice(0,12), `أي ${K.unit} تخلصها وتحط تاريخها في ${YEAR} تطلع هنا.`)}</section>
    <section>${sh(K.back)}${grid(paused, 'ولا شي موقّف 👌')}</section>
    <section>${sh('آخر المراجعات', revs.length ? `<button type="button" data-go="reviews">الكل ‹</button>` : '')}${revs.length ? reviewList(revs) : `<div class="empty">اكتب مراجعة لأي ${K.unit} وتطلع هنا.</div>`}</section>
  </main>${sidebar()}`;
}
function renderLibrary(){
  const all = mine(), K = KINDS[kind];
  const list = byDate(all.filter(i=>i.status===libFilter && (!libQ || i.title.toLowerCase().includes(libQ.toLowerCase()))));
  const chip = s => `<button class="chip" data-f="${s}" type="button" aria-pressed="${libFilter===s}">${K[s]} · ${all.filter(i=>i.status===s).length}</button>`;
  return `<main class="full"><section><div class="toolbar"><h2>${K.name}</h2></div>
    <div class="chips">${['done','played','playing','paused','dropped'].map(chip).join('')}</div>
    <div class="legend">${['done','played','dropped'].map(s=>`<span>${badge(s)}${K[s]}</span>`).join('')}</div>
    <label class="lsearch"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="libQ" type="search" placeholder="دوّر في ${esc(K[libFilter])}…" value="${esc(libQ)}" autocomplete="off"></label>
    <div id="libGrid">${grid(list, libQ ? 'ما لقيت شي بهالاسم' : `ما فيه شي في «${K[libFilter]}»`)}</div></section></main>`;
}
function renderWish(){
  const K = KINDS[kind], list = mine().filter(i => i.status==='wish');
  return `<main class="full"><section>
    <div class="toolbar"><h2>${K.list} · ${list.length}</h2><button class="btn primary" data-search type="button">+ ابحث وأضف</button></div>
    ${grid(list, `ما فيه شي في ${K.list}.`)}</section></main>`;
}
function renderReviews(){
  const list = byDate(mine().filter(i => i.review));
  return `<main>${sh(`المراجعات · ${list.length}`)}${list.length ? reviewList(list) : '<div class="empty">اكتب مراجعة لأي عنصر من نافذة التعديل، وتطلع هنا وفي الملف.</div>'}</main>${sidebar()}`;
}
function listItems(l){ return l.items.map(itemById).filter(Boolean); }
function renderLists(){
  const K = KINDS[kind], lists = S.lists.filter(l => l.kind===kind);
  const genres = [...new Set(mine().map(i=>i.genre).filter(Boolean))];
  const ideas = [`أفضل ${K.best} ${YEAR}`, ...(genres.length ? genres.map(g=>`أفضل ${K.best} ${g}`) : [`أفضل ${K.best} (جانرا)`]), `أفضل ${K.best} على الإطلاق`];
  return `<main class="full"><section>
    <div class="toolbar"><h2>القوائم · ${lists.length}</h2><button class="btn primary" type="button" data-newlist="">+ قائمة جديدة</button></div>
    <div class="ideas"><small>أفكار:</small>${ideas.map(t=>`<button class="chip" type="button" data-newlist="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    ${lists.length ? `<div class="lists">${lists.map(l => { const its = listItems(l); return `<button class="lcard" type="button" data-list="${esc(l.id)}">
      <div class="fan">${its.slice(0,5).map(i=>cover(i)).join('') || '<div class="empty" style="width:100%;padding:10px">فاضية</div>'}</div>
      <div><h3>${esc(l.title)}</h3><p>${its.length} ${K.unit}${l.desc?' · '+esc(l.desc):''}</p></div></button>`; }).join('')}</div>`
      : '<div class="empty">سوّ أول قائمة لك، مثلاً «أفضل ألعاب السنة».</div>'}

let preset = null;
const META = ['year','by','genre','platforms','about'];
function openItem(item, status='done', pre=null){
  editing = item; preset = pre;
  const i = item || {kind, status, rating:0, date: status==='wish' ? '' : new Date().toISOString().slice(0,10), ...(pre||{})};
  const locked = !!(pre || (item && item.by));
  $('fFixed').hidden = !locked; $('fFixed').textContent = (i.title||'') + (i.year ? ' ('+i.year+')' : '');
  $('fTitleWrap').hidden = locked; $('fKind').disabled = locked;
  $('mTitle').textContent = item ? 'تعديل' : 'سجّل';
  $('fTitle').value = i.title || ''; $('fKind').value = i.kind;
  fillStatus(i.kind, i.status);
  $('fSub').value = i.sub || 'مسلسل'; $('fGenre').value = i.genre || '';
  $('fRating').value = String(i.rating || 0); $('fDate').value = i.date || '';
  $('fFav').checked = !!(item && isFav(item)); $('fReview').value = i.review || '';
  $('fDel').hidden = !item; $('fDel').textContent = 'حذف'; $('fDel').dataset.armed = '';
  $('itemModal').hidden = false; $('fTitle').focus();
}
$('itemForm').onsubmit = e => {
  e.preventDefault();
  const data = { title:$('fTitle').value.trim(), kind:$('fKind').value, status:$('fStatus').value,
    rating:+$('fRating').value, date:$('fDate').value, fav:$('fFav').checked, review:$('fReview').value.trim(), genre:$('fGenre').value.trim() };
  if (data.kind==='shows') data.sub = $('fSub').value;
  if (!data.title) return;
  const wantFav = data.fav; delete data.fav;
  if (wantFav && !(editing && isFav(editing))) {
    const favs = S.favs[data.kind] || [];
    if (favs.length >= 5) { $('fFav').checked = false; $('fFav').parentNode.lastChild.textContent = ' المفضلة مليانة (5)، شيل وحدة أول'; return; }
  }
  if (editing) { Object.assign(editing, data); delete editing.ex; if (data.kind!=='shows') delete editing.sub; }
  else { const n = { id:uid('i'), ...data }; if (preset) META.forEach(k => { if (preset[k]) n[k] = preset[k]; }); S.items.push(n); editing = n; }
  const fl = S.favs[data.kind] = S.favs[data.kind] || [];
  if (wantFav && !fl.includes(editing.id)) fl.push(editing.id);
  if (!wantFav && fl.includes(editing.id)) { fl.splice(fl.indexOf(editing.id),1); if (S.crown[data.kind]===editing.id) delete S.crown[data.kind]; }
  $('itemModal').hidden = true; kind = data.kind; render(); persist();
};
$('fFav').onchange = () => { $('fFav').parentNode.lastChild.textContent = ' من المفضلة 👑'; };
$('fDel').onclick = () => {
  if (!$('fDel').dataset.armed) { $('fDel').dataset.armed = '1'; $('fDel').textContent = 'متأكد؟ اضغط مرة ثانية'; return; }
  const id = editing.id;
  S.items = S.items.filter(i => i !== editing);
  S.lists.forEach(l => l.items = l.items.filter(x => x !== id));
  Object.keys(S.favs).forEach(k => S.favs[k] = S.favs[k].filter(x => x !== id));
  Object.keys(S.crown).forEach(k => { if (S.crown[k]===id) delete S.crown[k]; });
  $('itemModal').hidden = true; render(); persist();
};
$('fCancel').onclick = () => $('itemModal').hidden = true;

/* ---- search (Claude looks up the real title) ---- */
let sample = null, sKind = kind, sCtl = null, sResults = [];
const KIND_EN = {games:'video games', movies:'feature films', shows:'TV series or anime'};
function openSearch(q=''){
  sKind = kind; $('sQ').value = q; $('sStep1').hidden = false; $('sStep2').hidden = true;
  renderSKinds(); $('sRes').innerHTML = sResults.length ? '' : `<div class="sstate">اكتب الاسم واضغط بحث</div>`; sResults = [];
  $('searchModal').hidden = false; $('sQ').focus();
}
function renderSKinds(){
  $('sKinds').innerHTML = Object.keys(KINDS).map(k => `<button class="chip" type="button" data-sk="${k}" aria-pressed="${sKind===k}">${{games:'ألعاب',movies:'أفلام',shows:'مسلسلات وأنمي'}[k]}</button>`).join('');
}
$('tForm').onsubmit = e => { e.preventDefault(); const q = $('tQ').value.trim(); openSearch(q); if (q) doSearch(); $('tQ').blur(); };
$('sKinds').onclick = e => { const b = e.target.closest('[data-sk]'); if (!b) return; sKind = b.dataset.sk; renderSKinds(); if ($('sQ').value.trim()) doSearch(); };
$('sForm').onsubmit = e => { e.preventDefault(); doSearch(); };
async function doSearch(){
  const q = $('sQ').value.trim(); if (!q) return;
  if (!sample) { $('sRes').innerHTML = `<div class="sstate">البحث ما يشتغل في هذا العرض.</div>`; return; }
  sCtl?.abort(); sCtl = new AbortController();
  $('sRes').innerHTML = `<div class="sstate">يدوّر…</div>`;
  const extra = sKind==='games' ? ', "platforms": short platform list like "PS5, PC, Switch"' : sKind==='shows' ? ', "type": "أنمي" or "مسلسل"' : '';
  const byWhat = {games:'developer', movies:'director', shows:'studio or network'}[sKind];
  const prompt = `You are the catalog lookup for a personal ${KIND_EN[sKind]} tracker. The user searched for: "${q.slice(0,120)}".
Return ONLY a JSON array (max 8) of real ${KIND_EN[sKind]} that match, most relevant first. Treat remakes, remasters, sequels and different editions as SEPARATE entries with their own year, so the user can pick the exact version they played or watched.
Each entry: {"title": official title as commonly listed in English (or romaji for anime), "year": release year number, "by": ${byWhat}, "genre": one short genre in Arabic, "about": one Arabic sentence under 20 words${extra}}.
Only include titles you are confident exist. If nothing matches return [].`;
  try {
    const res = await sample.json(prompt, { modelTier:'quick', signal:sCtl.signal, cache:{gcTime:86400000} });
    sResults = Array.isArray(res) ? res.filter(r => r && typeof r.title === 'string').slice(0,8) : [];
    renderResults();
  } catch (err) {
    if (err.code === 'cancelled') return;
    const msg = ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(err.code)
      ? 'البحث يحتاج تسمح للصفحة تستخدم Claude.'
      : err.code==='rate_limited' ? 'بحثت كثير، استنى شوي وجرّب.' : 'صار خطأ في البحث، جرّب مرة ثانية.';
    $('sRes').innerHTML = `<div class="sstate">${msg}</div>`;
  }
}
const haveIt = r => S.items.find(i => i.kind===sKind && i.title.toLowerCase()===String(r.title).toLowerCase() && (!i.year || !r.year || +i.year===+r.year));
function renderResults(){
  if (!sResults.length) { $('sRes').innerHTML = `<div class="sstate">ما لقيت شي بهالاسم. جرّب تكتبه بطريقة ثانية أو بالإنجليزي.</div>`; return; }
  $('sRes').innerHTML = `<div class="sres">${sResults.map((r,ix) => `<button class="srow" type="button" data-pick="${ix}">${cover({title:String(r.title)})}
    <span><b>${esc(r.title)}</b><small>${esc([r.year, r.by, r.genre].filter(Boolean).join(' · '))}</small></span>${haveIt(r)?'<span class="have">عندك ✓</span>':''}</button>`).join('')}</div>`;
}
$('sRes').onclick = e => { const b = e.target.closest('[data-pick]'); if (b) showDetail(sResults[+b.dataset.pick]); };
function showDetail(r){
  const pre = { kind:sKind, title:String(r.title), year:r.year?String(r.year):'', by:r.by?String(r.by):'', genre:r.genre?String(r.genre):'', platforms:r.platforms?String(r.platforms):'', about:r.about?String(r.about):'' };
  if (sKind==='shows') pre.sub = r.type==='أنمي' ? 'أنمي' : 'مسلسل';
  const have = haveIt(r), K = KINDS[sKind];
  const byLbl = {games:'المطوّر',movies:'المخرج',shows:'الاستوديو'}[sKind];
  $('sStep2').innerHTML = `<button type="button" class="linkbtn" data-back>‹ رجوع للنتائج</button>
    <div class="detail">${cover(pre)}<div><h3>${esc(pre.title)}</h3><div class="dmeta">
      ${pre.year?`<span>السنة: <b>${esc(pre.year)}</b></span>`:''}${pre.by?`<span>${byLbl}: <b>${esc(pre.by)}</b></span>`:''}
      ${pre.genre?`<span>الجانرا: <b>${esc(pre.genre)}</b></span>`:''}${pre.platforms?`<span>المنصات: <b>${esc(pre.platforms)}</b></span>`:''}</div>
      ${pre.about?`<p class="dabout">${esc(pre.about)}</p>`:''}</div></div>
    <div class="dact">${have
      ? `<button class="btn primary" type="button" data-edit-have="${esc(have.id)}">تعديل تسجيلي</button><span class="have" style="align-self:center">عندك: ${esc(KINDS[have.kind][have.status])}</span>`
      : `<button class="btn primary" type="button" data-log>سجّل</button><button class="btn" type="button" data-towish>+ ${esc(K.list)}</button>`}</div>`;
  $('sStep2').dataset.pre = JSON.stringify(pre);
  $('sStep1').hidden = true; $('sStep2').hidden = false;
}
$('sStep2').onclick = e => {
  const pre = JSON.parse($('sStep2').dataset.pre || '{}');
  if (e.target.closest('[data-back]')) { $('sStep2').hidden = true; $('sStep1').hidden = false; return; }
  if (e.target.closest('[data-log]')) { $('searchModal').hidden = true; openItem(null, 'done', pre); return; }
  if (e.target.closest('[data-towish]')) {
    const n = { id:uid('i'), status:'wish', rating:0, date:'', review:'', ...pre }; Object.keys(n).forEach(k => n[k]==='' && k!=='date' && k!=='review' && delete n[k]);
    S.items.push(n); kind = pre.kind; $('searchModal').hidden = true; render(); persist(); return;
  }
  const h = e.target.closest('[data-edit-have]'); if (h) { $('searchModal').hidden = true; openItem(itemById(h.dataset.editHave)); }
};

};
$('feRow').addEventListener('dragstart', e => { const s = e.target.closest('.slot'); if (!s) return; feDrag = +s.dataset.ix; s.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(feDrag)); } catch(_){} });
$('feRow').addEventListener('dragover', e => { const s = e.target.closest('.slot'); if (s && feDrag!==null) { e.preventDefault(); document.querySelectorAll('.slot.over').forEach(x=>x.classList.remove('over')); s.classList.add('over'); } });
$('feRow').addEventListener('drop', e => { const s = e.target.closest('.slot'); if (!s || feDrag===null) return; e.preventDefault(); const ids = feFavs[feKind]; const [m] = ids.splice(feDrag,1); ids.splice(+s.dataset.ix,0,m); feDrag=null; renderFE(); });
$('feRow').addEventListener('dragend', () => { feDrag=null; document.querySelectorAll('.slot').forEach(x=>x.classList.remove('drag','over')); });

function openProfile(){ feKind = kind; feFavs = JSON.parse(JSON.stringify(S.favs)); feCrown = {...S.crown}; renderFE(); pendingBanner = null; $('pName').value = S.profile.name; $('pBio').value = S.profile.bio||''; showBnPrev(S.profile.banner); $('profModal').hidden = false; }
$('editProfile').onclick = openProfile;
$('bannerBtn').onclick = openProfile;
$('pBanner').onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const im = new Image();
    im.onload = () => {
      const scale = Math.min(1, 1800 / im.width);
      const c = document.createElement('canvas');
      c.width = Math.round(im.width*scale); c.height = Math.round(im.height*scale);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      pendingBanner = c.toDataURL('image/jpeg', 0.8); showBnPrev(pendingBanner);
    };
    im.src = reader.result;
  };
  reader.readAsDataURL(file); e.target.value = '';
};
$('pBannerDel').onclick = () => { pendingBanner = ''; showBnPrev(''); };
$('profForm').onsubmit = e => {
  e.preventDefault();
  S.profile.name = $('pName').value.trim() || S.profile.name;
  S.profile.bio = $('pBio').value.trim();
  if (pendingBanner !== null) S.profile.banner = pendingBanner;
  S.favs = feFavs; S.crown = feCrown;
  $('profModal').hidden = true; render(); persist();
};
$('pCancel').onclick = () => $('profModal').hidden = true;
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if (e.target===o) o.hidden = true; }));
document.addEventListener('keydown', e => { if (e.key!=='Escape') return; const open = [...document.querySelectorAll('.overlay')].filter(o=>!o.hidden); if (open.length) open[open.length-1].hidden = true; });

$('kinds').onclick = e => { const b=e.target.closest('button'); if(!b) return; kind=b.dataset.k; libFilter='done'; libQ=''; if (view==='list') view='lists'; try{localStorage.setItem('shelf-kind',kind)}catch(_){} render(); };
$('app').addEventListener('click', e => {
  if (e.target.closest('.overlay')) return;
  const t = e.target;
  if (t.closest('[data-search]')) return openSearch();
  const tile = t.closest('.tile'); if (tile) return go(tile.dataset.v);
  const g = t.closest('[data-go]'); if (g) return go(g.dataset.go);
  const nl = t.closest('[data-newlist]'); if (nl) return openList(null, nl.dataset.newlist);
  const lc = t.closest('[data-list]'); if (lc) { listId = lc.dataset.list; return go('list'); }
  if (t.closest('[data-editlist]')) return openList(S.lists.find(l=>l.id===listId));
  const L = S.lists.find(l=>l.id===listId);
  const mv = t.closest('[data-mv]');
  if (mv && L) { const ix=+mv.dataset.ix, to=ix+(+mv.dataset.mv); [L.items[ix],L.items[to]]=[L.items[to],L.items[ix]]; render(); persist(); return; }
  const rm = t.closest('[data-rm]'); if (rm && L) { L.items.splice(+rm.dataset.rm,1); render(); persist(); return; }
  if (t.closest('[data-addto]') && L) { const v=$('addSel').value; if (v) { L.items.push(v); render(); persist(); } return; }
  if (t.closest('[data-newfriend]')) return openFriend(null);
  const fe = t.closest('[data-friend]'); if (fe) return openFriend(S.friends.find(f=>f.id===fe.dataset.friend));
  const c = t.closest('.card'); if (c) return openItem(itemById(c.dataset.id));
  const f = t.closest('.chip[data-f]'); if (f) { libFilter=f.dataset.f; render(); }
  if (t.closest('[data-editfav]')) { openProfile(); return; }
});

document.addEventListener('input', e => {
  if (e.target.id !== 'libQ') return;
  libQ = e.target.value;
  const K = KINDS[kind], list = byDate(mine().filter(i=>i.status===libFilter && (!libQ || i.title.toLowerCase().includes(libQ.toLowerCase()))));
  $('libGrid').innerHTML = grid(list, libQ ? 'ما لقيت شي بهالاسم' : `ما فيه شي في «${K[libFilter]}»`);
});

/* ---- saving: the page republishes itself with the new data ---- */
let art = null, saveT = null;
const setSave = t => $('save').textContent = t;
function persist(){ setSave('يحفظ…'); clearTimeout(saveT); saveT = setTimeout(doPublish, 900); }
async function doPublish(){
  if (!art) { setSave('ما ينحفظ هنا'); return; }
  const json = JSON.stringify(S).replace(/</g,'\\u003c');
  const body = TEMPLATE.replace(STATE_RE, (m,a,b) => a + json + b);
  const reset = document.head.querySelector('style')?.textContent || '';
  const html = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' + body + '</body></html>';
  try { await art.publish(html); setSave('محفوظ ✓'); setTimeout(()=>setSave(''),2500); }
  catch (err) {
    const c = err && err.code;
    setSave(c==='conflict' ? 'تعديل ثاني سبقك' : (c==='not_writer'||c==='not_granted') ? 'للعرض فقط' : 'ما انحفظ، جرّب مرة ثانية');
  }
}
render();
(async () => { try { if (window.claude?.use) { [art, sample] = await Promise.all([window.claude.use('artifact'), window.claude.use('sample')]); } } catch(e) {} })();
</script>

</body></html>
